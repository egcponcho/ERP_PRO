<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP PRO</title>
    <script>
      // Tema antes de pintar: evita el destello claro en el modo oscuro
      try { const t = localStorage.getItem('erp.tema'); if (t) document.documentElement.dataset.theme = t } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
